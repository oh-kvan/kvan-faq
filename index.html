<style>
/* Layout: sticky search console on top, single column of answer cards below — built for scanning mid-call */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --fg:#1A1A1A; --muted:#5E6268; --line:#DEDAD3;
  --steel:#4A4E54; --amber:#C17F24; --amber-ink:#8A5A14; --amber-soft:#F6E9D4;
  --warn:#B4442E; --warn-soft:#F7E2DC; --mark:#FBE3B4;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1E1F21; --fg:#F0EDE8; --muted:#A3A7AD; --line:#33363A;
  --steel:#8C9198; --amber:#D9962F; --amber-ink:#E8B460; --amber-soft:#3A2C17;
  --warn:#E57A62; --warn-soft:#3B211B; --mark:#5A4217; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1E1F21; --fg:#F0EDE8; --muted:#A3A7AD; --line:#33363A;
  --steel:#8C9198; --amber:#D9962F; --amber-ink:#E8B460; --amber-soft:#3A2C17;
  --warn:#E57A62; --warn-soft:#3B211B; --mark:#5A4217; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:18px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
h1 span{color:var(--amber)}
.src{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer}
.search{margin-top:12px;position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:13px 44px 13px 16px;border:2px solid var(--steel);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
.search input:focus{border-color:var(--amber)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg);opacity:.7}
.chip.esc[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip:focus-visible,.copy:focus-visible,.src button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.count{font-size:13px;color:var(--muted);margin:16px 0 8px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.id{font-family:var(--mono)}
.cat{color:var(--steel);font-weight:600}
.esc-badge{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 7px;font-weight:600}
.q{font-size:16px;font-weight:600;margin:0;text-wrap:balance}
.key{background:var(--amber-soft);color:var(--amber-ink);font-weight:600;border-radius:6px;padding:7px 10px;font-size:15px}
.a{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{font-size:12px;color:var(--muted)}
.copy{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.rule{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.rule a{color:var(--amber-ink)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--steel)}}
</style>

<script>
/* ===== 설정 ===== */
const SHEET_ID = "1xJCttDwDCikH-NSrH5dvpm7x4oKvfQu8N6jZeulTDfw";
const CSV_URL  = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv";
const SHEET_URL= "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";
const FALLBACK = [{"ID": "Q001", "카테고리": "차량·일정", "질문": "통화를 처음 시작할 때 뭐라고 하나요?", "답변": "\"안녕하세요. 기아샵에서 케이밴 시공상품 주문해 주셔서 시공 일정 때문에 연락드렸습니다.\" 이후 차량 인수 → 시공 날짜 → 장소 → 상품 구성 → 설치 방법 → 추가비용 순서로 확인합니다.", "핵심": "확인 순서: 차량 → 날짜 → 장소 → 구성 → 설치방법 → 비용", "키워드": "첫인사,오프닝,시작멘트,순서", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q002", "카테고리": "차량·일정", "질문": "고객이 아직 차량을 인수받지 않았어요", "답변": "\"차량은 언제쯤 인수받으실 예정이세요?\" 인수 예정일을 확인한 뒤 그 이후로 시공 일정을 잡습니다.", "핵심": "인수 예정일 확인 후 일정 확정", "키워드": "출고,인수,미출고,차량없음", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q003", "카테고리": "차량·일정", "질문": "차량이 썬팅샵에 있어요", "답변": "\"현재 차량이 썬팅샵에 있나요?\" 썬팅 일정이 끝나는 시점에 맞춰 케이밴 시공이 가능한지 확인합니다.", "핵심": "썬팅 일정에 맞춰 시공일 조율", "키워드": "썬팅,틴팅,썬팅샵", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q004", "카테고리": "차량·일정", "질문": "빨리 시공하고 싶다고 해요", "답변": "\"급하게 시공을 원하시면 케이밴으로 차량을 가져오시면 가능한 빠른 일정으로 확인해 드릴 수 있습니다.\"", "핵심": "급하면 본사 방문 권유", "키워드": "급함,빠른,긴급,당장", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q005", "카테고리": "시공장소·출장", "질문": "시공은 어디서 하나요?", "답변": "\"시공은 어디에서 받으실 예정이세요?\" 케이밴 본사 시공 또는 고객이 원하는 장소로 출장 시공이 가능합니다. 출장이면 주소 또는 건물명을 정확하게 받습니다.", "핵심": "본사 or 출장 / 출장은 주소·건물명 필수", "키워드": "장소,출장,본사,주소", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q006", "카테고리": "시공장소·출장", "질문": "출장비가 있나요?", "답변": "\"서울·경기 지역은 출장비가 없습니다. 서울·경기 외 지역은 출장비 10만원이 별도로 발생합니다.\" 반드시 미리 안내합니다.", "핵심": "서울·경기 무료 / 그 외 10만원", "키워드": "출장비,지방,지역,비용", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q007", "카테고리": "시공장소·출장", "질문": "천안·아산 등 본사 근처 고객이에요", "답변": "\"출장으로 시공하시면 출장비가 발생합니다. 본사로 차량을 가져오시면 출장비 없이 시공하실 수 있습니다.\" 출장 시공 / 본사 방문 중 고객이 선택하게 합니다.", "핵심": "출장(유료) vs 본사 방문(무료) 고객 선택", "키워드": "천안,아산,근처,본사방문", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q008", "카테고리": "시공장소·출장", "질문": "지하주차장에서 시공해도 되나요?", "답변": "\"지하주차장에서 시공하실 경우 주차장 높이가 2.3m 이상인지 확인 부탁드립니다.\" 케이밴 시공 차량(ST1)이 높아서 2.3m 미만이면 들어갈 수 없습니다. 안 되면 \"지상주차장이나 주변에 시공할 수 있는 장소가 있을까요?\"", "핵심": "높이 2.3m 이상 필수 (ST1 차량)", "키워드": "지하주차장,높이,2.3m,ST1,주차장", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q009", "카테고리": "시공장소·출장", "질문": "아파트·건물 주차장 출입은요?", "답변": "차량등록이 필요한지 꼭 확인합니다. 필요하면 케이밴 시공 차량번호를 고객에게 미리 알려 출입 등록을 부탁드립니다.", "핵심": "차량등록 필요 여부 확인 → 시공차량 번호 전달", "키워드": "차량등록,출입,아파트,방문차량", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q010", "카테고리": "바닥·체크판", "질문": "알루미늄 체크판만 주문한 고객이에요", "답변": "\"차량 카고룸 바닥이 설치되어 있나요?\" 기아 출고 시 카고룸 바닥 옵션을 선택했는지 반드시 확인합니다. 있고 없고에 따라 시공 방법과 비용이 달라집니다.", "핵심": "카고룸 바닥 유무 필수 확인", "키워드": "체크판,알루미늄,바닥,카고룸", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q011", "카테고리": "바닥·체크판", "질문": "카고룸 바닥이 있으면 어떻게 시공하나요?", "답변": "기존 카고룸 바닥을 들어내고 차량 바닥을 평탄화·보강한 뒤, 태고합판 대신 기존 카고룸 바닥을 사용해 차량 바닥에 손상 없이 시공합니다. 태고합판 추가가 필요 없습니다.", "핵심": "기존 카고룸 바닥 재활용 / 태고합판 불필요", "키워드": "카고룸있음,기존바닥,재활용", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q012", "카테고리": "바닥·체크판", "질문": "카고룸 바닥이 없으면요?", "답변": "\"카고룸 바닥이 없는 경우 차량 바닥 보호를 위해 태고합판을 설치하는 방법이 있습니다. 태고합판 설치 비용은 44만원이 추가됩니다.\" 전기차는 바닥에 배터리가 있어 손상 주의.", "핵심": "태고합판 44만원 추가", "키워드": "카고룸없음,태고합판,방수합판,44만원,전기차,배터리", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q013", "카테고리": "바닥·체크판", "질문": "태고합판을 고객이 직접 준비한대요", "답변": "\"아무 합판이나 준비하시면 안 됩니다. 태고합판 사이즈와 알루미늄 체크판 사이즈, 그리고 기존 차량 바닥의 볼트 위치가 정확하게 맞아야 합니다.\"", "핵심": "사이즈 2가지 + 볼트 위치 일치 필수", "키워드": "직접준비,합판구매,자재지참,볼트위치", "사장님확인": "O", "수정일": "2026-10-12"}, {"ID": "Q014", "카테고리": "바닥·체크판", "질문": "태고합판 없이 알루미늄만 깔 수 있나요?", "답변": "가능하지만 리벳 등으로 차량 바닥에 손상이 생길 수 있습니다(전기차 배터리 주의). 마감도 다릅니다: 태고합판 사용 시 논슬립+실리콘 마감 / 알루미늄만 시공 시 평탄화·보강 후 테두리 고무 마감. 기아샵 사진과 실제 시공이 다를 수 있음도 안내. 직원이 정하지 말고 고객이 선택합니다.", "핵심": "손상 위험 설명 → 고객 선택 (직원 임의결정 금지)", "키워드": "알루미늄만,합판없이,리벳,마감,논슬립,실리콘,고무", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q015", "카테고리": "선반 설치", "질문": "3단 선반 왼쪽/오른쪽은 어떻게 물어보나요?", "답변": "\"3단 선반은 운전석 쪽, 즉 좌측형으로 설치하실까요? 아니면 조수석 쪽, 우측형으로 설치하실까요?\" 기준은 트렁크에서 차량 안쪽을 바라볼 때입니다. '왼쪽'만 묻지 말고 반드시 운전석/조수석을 함께 확인하고 기록합니다.", "핵심": "좌측형 = 운전석 / 우측형 = 조수석 (트렁크에서 바라본 기준)", "키워드": "좌측,우측,왼쪽,오른쪽,운전석,조수석,스마트패키지,밀워키", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q016", "카테고리": "선반 설치", "질문": "선반을 일자형으로 설치하고 싶대요", "답변": "\"일자형으로 설치하실 경우 프레임이 서로 붙어서 설치되는 구조라서 설치 후에는 선반 높낮이를 조절하실 수 없습니다. 평소 사용하시는 공구나 자재 높이를 미리 확인하시고 그 높이에 맞춰 처음부터 결정하셔야 합니다.\"", "핵심": "일자형 = 설치 후 높이 조절 불가", "키워드": "일자형,연결,높이조절,높낮이", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q017", "카테고리": "선반 설치", "질문": "공구·자재 높이를 지금 모르겠대요", "답변": "\"정확하게 확인하기 어려우시면 시공할 때 공구나 자재를 같이 확인하고 선반 높이를 결정하셔도 됩니다.\" 미리 알려주시면 그 높이로 조립해서 갑니다.", "핵심": "현장에서 결정 가능 / 미리 알면 사전 조립", "키워드": "높이모름,현장확인,공구높이", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q018", "카테고리": "선반 설치", "질문": "일자형과 개별 설치 차이가 뭐예요?", "답변": "\"일자형은 깔끔하지만 설치 후 높낮이 조절이 어렵습니다. 각각 따로 설치하시면 프레임 볼트가 보여서 비교적 쉽게 높이를 바꾸실 수 있습니다. 원하시는 방식으로 선택하시면 됩니다.\"", "핵심": "일자형: 깔끔·조절불가 / 개별: 조절 쉬움", "키워드": "개별설치,따로,차이,비교", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q019", "카테고리": "선반 설치", "질문": "격벽에 부품선반이나 3단 선반을 달고 싶대요", "답변": "\"격벽에 설치하시는 경우 휠 간섭이 없어서 바닥이 파이지 않은 상품으로 변경해 설치할 수 있습니다. 다만 프레임을 변경하면 나중에 다시 휠 쪽에는 설치할 수 없으니 위치를 미리 결정해 주셔야 합니다.\"", "핵심": "격벽용 프레임 변경 시 휠 쪽 재설치 불가", "키워드": "격벽,부품선반,휠간섭,프레임변경", "사장님확인": "O", "수정일": "2026-10-12"}, {"ID": "Q020", "카테고리": "통로·사이즈", "질문": "양쪽에 3단 선반을 다 달면요?", "답변": "\"양쪽에 3단 선반을 설치하시면 가운데 통로가 약 400mm 정도로 좁아집니다. 공구나 자재를 들고 들어가실 때 불편할 수 있는데 괜찮으실까요?\"", "핵심": "양쪽 3단 → 통로 약 400mm", "키워드": "양쪽,통로,400,좁음", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q021", "카테고리": "통로·사이즈", "질문": "K3단 부품선반 + K3단 선반 조합이면요?", "답변": "가운데 통로가 약 550mm입니다. 고객들이 가장 많이 선택하는 보편적인 구성입니다.", "핵심": "통로 약 550mm / 인기 구성", "키워드": "부품선반,550,인기,보편", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q022", "카테고리": "통로·사이즈", "질문": "제품 사이즈를 물어봐요", "답변": "제품별 사이즈표를 보고 안내합니다. 표에 없으면 절대 추측하지 말고 \"정확히 확인해서 다시 연락드리겠습니다\"라고 한 뒤 사장님께 확인합니다.", "핵심": "모르면 추측 금지 → 확인 후 회신", "키워드": "사이즈,크기,치수,공간,몇cm", "사장님확인": "O", "수정일": "2026-10-12"}, {"ID": "Q023", "카테고리": "변경·추가비용", "질문": "2단 프레임을 3단 프레임으로 바꾸면?", "답변": "추가 10만원입니다.", "핵심": "+10만원", "키워드": "2단,3단,프레임변경", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q024", "카테고리": "변경·추가비용", "질문": "2단 선반을 3단 선반으로 바꾸면?", "답변": "프레임 변경 + 트레이 1개 추가로 추가 30만원입니다. (단품 기준: 3단 선반 단품가 − 2단 선반 단품가 차액 추가 결제)", "핵심": "+30만원", "키워드": "2단선반,3단선반,업그레이드,트레이", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q025", "카테고리": "변경·추가비용", "질문": "선반 1단만 더 추가하면?", "답변": "1단당 20만원입니다.", "핵심": "1단당 20만원", "키워드": "단추가,선반추가,트레이추가", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q026", "카테고리": "변경·추가비용", "질문": "설치 후에 높이나 위치를 바꾸고 싶으면?", "답변": "\"추후 높이나 위치를 변경하실 경우 출장비가 별도로 발생하고 설치비가 약 30만원 정도 발생할 수 있습니다.\" 그래서 처음에 신중히 결정하도록 안내합니다.", "핵심": "출장비 + 설치비 약 30만원", "키워드": "재시공,위치변경,높이변경,나중에", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q027", "카테고리": "패키지 구성변경", "질문": "패키지에서 2단 선반을 3단 부품선반으로 바꿔달래요", "답변": "패키지는 할인상품이라 단품처럼 계산하지 않습니다. (3단 부품선반 단품가 − 2단 선반 단품가)의 50%만 인정하고, 현금 환불이 아니라 고무스트랩·후크걸이 등 액세서리로 대체합니다. \"기아샵에서 결제하신 상품이라 케이밴에서 차액을 현금으로 빼드리거나 환불해 드리는 방식이 아닙니다.\"", "핵심": "차액의 50% → 액세서리로 대체 (현금 환불 X)", "키워드": "패키지,구성변경,부품선반,차액,환불,액세서리", "사장님확인": "O", "수정일": "2026-10-12"}, {"ID": "Q028", "카테고리": "최종확인", "질문": "통화 마지막에 뭘 확인하나요?", "답변": "\"고객님, 최종적으로 확인해 보겠습니다. 시공일은 ○월 ○일, 장소는 ○○입니다. 3단 선반은 ○○쪽(운전석/조수석)에 설치하고, 일자형이면 선반 높이는 ○○로 하겠습니다. 체크판은 ○○ 방식, 추가비용은 ○○원입니다. 이렇게 진행해 드리면 될까요?\" 고객 확인 후 일정 확정.", "핵심": "날짜·장소·상품·설치방법·추가비용 복창", "키워드": "최종확인,마무리,복창,클로징", "사장님확인": "", "수정일": "2026-10-12"}, {"ID": "Q029", "카테고리": "최종확인", "질문": "모르는 질문이 나오면요?", "답변": "추측하지 않습니다. \"정확하게 확인해서 오늘 ○시까지 다시 연락드리겠습니다.\" 질문 내용과 고객 연락처를 기록해 사장님께 전달합니다.", "핵심": "추측 금지 → 회신 시간 약속 → 사장님 전달", "키워드": "모름,모르는질문,넘김,에스컬레이션", "사장님확인": "O", "수정일": "2026-10-12"}];

/* ===== CSV ===== */
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}
 if(f||r.length){r.push(f);rows.push(r)}
 const h=rows.shift().map(s=>s.trim());return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

/* ===== 한글 초성 ===== */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const toCho=s=>[...s].map(ch=>{const c=ch.charCodeAt(0)-44032;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join("");
const isCho=s=>/^[ㄱ-ㅎ]+$/.test(s);
const norm=s=>(s||"").toLowerCase().replace(/\s+/g,"");

let DATA=[],cat="전체",escOnly=false;
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function prep(rows){return rows.filter(r=>r["질문"]).map(r=>{
  const hay=[r["질문"],r["키워드"],r["핵심"],r["답변"],r["카테고리"]].join(" ");
  return {...r,_n:norm(hay),_c:toCho(norm(hay)),_qn:norm(r["질문"]+" "+r["키워드"])}})}

function score(r,terms){let s=0;for(const t of terms){
  if(isCho(t)){const c=toCho(r._qn);if(c.includes(t))s+=3;else if(r._c.includes(t))s+=1;else return -1}
  else{if(r._qn.includes(t))s+=3;else if(r._n.includes(t))s+=1;else return -1}}return s}

function hl(text,terms){let h=esc(text);terms.filter(t=>!isCho(t)&&t.length>0).forEach(t=>{
  const re=new RegExp(t.split("").map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s*"),"gi");
  h=h.replace(re,m=>"<mark>"+m+"</mark>")});return h}

function chips(){const cats=["전체",...new Set(DATA.map(r=>r["카테고리"]))];
  const n=c=>c=="전체"?DATA.length:DATA.filter(r=>r["카테고리"]==c).length;
  $("chips").innerHTML=cats.map(c=>`<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${c==cat}">${esc(c)} <b>${n(c)}</b></button>`).join("")
   +`<button class="chip esc" type="button" id="escBtn" aria-pressed="${escOnly}">사장님 확인 필요 <b>${DATA.filter(r=>r["사장님확인"]).length}</b></button>`;
}

function render(){
  const raw=$("q").value.trim().toLowerCase();
  const terms=raw.split(/\s+/).filter(Boolean);
  let rows=DATA.filter(r=>(cat=="전체"||r["카테고리"]==cat)&&(!escOnly||r["사장님확인"]));
  if(terms.length){rows=rows.map(r=>[r,score(r,terms)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
  $("count").textContent=terms.length?`"${raw}" 검색 결과 ${rows.length}건`:`${rows.length}건`;
  if(!rows.length){$("list").innerHTML=`<div class="empty"><strong>맞는 답이 없습니다</strong>추측하지 말고 "정확하게 확인해서 다시 연락드리겠습니다"라고 안내한 뒤 사장님께 전달하세요.<br>새 질문은 구글 시트에 추가해 주세요.</div>`;return}
  $("list").innerHTML=rows.map(r=>`<article class="card">
    <div class="meta"><span class="id">${esc(r["ID"])}</span><span class="cat">${esc(r["카테고리"])}</span>${r["사장님확인"]?'<span class="esc-badge">사장님 확인</span>':""}</div>
    <h2 class="q">${hl(r["질문"],terms)}</h2>
    ${r["핵심"]?`<div class="key">${hl(r["핵심"],terms)}</div>`:""}
    <p class="a">${hl(r["답변"],terms)}</p>
    <div class="foot"><span class="tags">${esc((r["키워드"]||"").split(",").map(s=>"#"+s.trim()).join(" "))}</span>
    <button class="copy" type="button" data-id="${esc(r["ID"])}">답변 복사</button></div></article>`).join("");
}

async function load(){
  $("srcLabel").textContent="불러오는 중…";
  try{const res=await fetch(CSV_URL+"&t="+Date.now());if(!res.ok)throw 0;
    const rows=parseCSV(await res.text());if(!rows.length||!("질문" in rows[0]))throw 0;
    DATA=prep(rows);$("srcLabel").textContent="구글 시트 연결됨 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){DATA=prep(FALLBACK);$("srcLabel").textContent="저장된 데이터 표시 중 (시트 연결 안 됨)"}
  chips();render();
}

$("sheetLink").href=SHEET_URL;
$("q").addEventListener("input",render);
$("reload").addEventListener("click",load);
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  if(b.id=="escBtn")escOnly=!escOnly;else cat=b.dataset.c;chips();render()});
$("list").addEventListener("click",async e=>{const b=e.target.closest(".copy");if(!b)return;
  const r=DATA.find(x=>x["ID"]==b.dataset.id);try{await navigator.clipboard.writeText(r["답변"]);b.textContent="복사됨"}catch(_){b.textContent="복사 안 됨"}
  setTimeout(()=>b.textContent="답변 복사",1400)});
document.addEventListener("keydown",e=>{if(e.key=="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus()}
  if(e.key=="Escape"){$("q").value="";render()}});
load();
</script>
